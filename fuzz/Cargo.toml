[package]
name = "fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Its targets are run by `cargo xtask fuzz`, through cargo-fuzz.
[package.metadata]
cargo-fuzz = true

[dependencies]
bytes.workspace = true
engine-api.workspace = true
engine-core.workspace = true
engine-feedback.workspace = true
engine-message.workspace = true
engine-rules.workspace = true
engine-smtp.workspace = true
engine-store = { workspace = true, features = ["fuzz"] }
libfuzzer-sys.workspace = true

[lints]
workspace = true

[[bin]]
name = "provider"
path = "fuzz_targets/provider.rs"
test = false
doc = false
bench = false

