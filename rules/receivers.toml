rules = ["no-such-mailbox"]

[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["gmail-smtp-in.l.google.com"]
reply = "552 5.2.2 The email account that you tried to reach is over quota. Please direct the recipient to https://support.google.com/mail/?p=OverQuotaPerm - gsmtp"
site = "Google"
class = "mailbox-full"
rules = ["mailbox-full"]

[[tests]]
source = "constructed"
exchanges = ["mx.example.net"]
reply = "450 4.2.4 Mailing list expansion problem"
site = "mx.example.net"
class = "list-expansion"
rules = ["list-expansion"]

[[tests]]
source = "constructed"
exchanges = ["mx.example.net"]
reply = "550 5.1.8 Sender address rejected: domain not found"
site = "mx.example.net"
class = "bad-sender"
rules = ["bad-sender"]

[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["gmail-smtp-in.l.google.com"]
reply = "552 5.2.3 Your message exceeded Google's message size limits. Please visit http://mail.google.com/support/bin/answer.py?answer=8770 to review our size guidelines."
site = "Google"
class = "too-large"
rules = ["too-large"]

[[tests]]
source = "constructed"
exchanges = ["mx.example.net"]
reply = "452 4.3.1 Insufficient system storage"
site = "mx.example.net"
class = "system-unavailable"
