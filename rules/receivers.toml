# A reply with no enhanced status code has no class, and one with a detail
# IANA does not register, such as Microsoft's 4.7.650 below, has none either.
[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["hotmail-com.olc.protection.outlook.com"]
reply = "550 Requested action not taken: mailbox unavailable"
site = "Outlook"
rules = []

[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["mta5.am0.yahoodns.net"]
reply = "421 4.7.0 [TSS04] Messages from 0.0.0.0 temporarily deferred due to unexpected volume or user complaints - 4.16.55.1; see https://postmaster.yahooinc.com/error-codes"
site = "Yahoo"
class = "refused"
throttle_seconds = 7200
rules = ["refused", "defaults/ip-temporarily-deferred", "Yahoo/TSS04"]

[[tests]]
