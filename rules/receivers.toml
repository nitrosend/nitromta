[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["gmail-smtp-in.l.google.com"]
reply = "550 5.7.1 Unauthenticated email from example.com is not accepted due to domain's DMARC policy. Please contact the administrator of example.com domain if this was a legitimate mail. Please visit https://support.google.com/mail/answer/2451690 to learn about DMARC initiative."
