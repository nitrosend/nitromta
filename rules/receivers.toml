[[tests]]
source = "KumoMTA smart-sink, examples/smart-sink-docker/policy/responses.toml"
exchanges = ["mta5.am0.yahoodns.net"]
reply = "554 5.4.4 Domain Lookup Failed"
site = "Yahoo"
