# OpenDKIM as the harness runs it: signs every message Postfix hands it with
# the harness's RSA-2048 key, rsa-sha256 and relaxed/relaxed, over the same
# headers as every system.
Mode                s
Socket              local:/run/opendkim/opendkim.sock
UMask               007
Domain              bench.test
Selector            bench
KeyFile             /etc/bench/dkim/private.pem
Canonicalization    relaxed/relaxed
SignatureAlgorithm  rsa-sha256
SignHeaders         From,To,Subject,Date,Message-ID
# Postfix relays only for authenticated clients, so whatever reaches the
# milter is the generator's.
InternalHosts       0.0.0.0/0
UserID              opendkim
Syslog              no
