# The Rust gate and SDK matrix, also required at the exact release tag.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libclang, for the simulator's SQLite build
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - run: cargo xtask check
      - name: Install the SDK matrix's runtimes and pinned Bundler
        run: |
          sudo apt-get update && sudo apt-get install -y ruby-dev python3-venv
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          bundler=$(awk '/^BUNDLED WITH$/ { getline; print $1 }' sdk/ruby/Gemfile.lock)
          test -n "$bundler"
          gem install --user-install --no-document bundler --version "$bundler"
          ruby -e 'puts "#{Gem.user_dir}/bin"' >> "$GITHUB_PATH"
      - run: cargo xtask sdk
